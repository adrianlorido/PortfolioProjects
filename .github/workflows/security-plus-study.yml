name: security-plus-study

on:
  push:
    paths:
      - "security-plus-study/**"
      - ".github/workflows/security-plus-study.yml"
  pull_request:
    paths:
      - "security-plus-study/**"
      - ".github/workflows/security-plus-study.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: security-plus-study

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: security-plus-study/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate question bank
        run: npm run questions:validate
      - name: Seed SQL matches the question bank
        run: |
          npm run db:seed-sql
          git diff --exit-code -- supabase/seed.sql || (echo "::error::supabase/seed.sql is stale. Run npm run db:seed-sql and commit it." && exit 1)
      - name: Build (demo mode, no Supabase env)
        run: npm run build

  database:
    name: Migration, RLS and repository contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: security-plus-study/package-lock.json
      - run: npm ci
      - run: npm run test:db
