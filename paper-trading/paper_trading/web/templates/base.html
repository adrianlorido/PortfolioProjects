<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper Trading{% endblock %} · SAMPLE</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="sample-banner" role="alert">SAMPLE DATA — PAPER ONLY</div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Local simulation. No live market data, no broker connection, no real orders.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
